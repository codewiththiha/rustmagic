[workspace]
resolver = "2"
members = [
    "crates/km-core",
    "crates/km-binary",
    "crates/km-script",
    "crates/km-engine",
    "crates/km-store",
    "crates/km-session",
    "crates/km-ibus",
    "crates/km-ffi",
    "crates/ui-egui",
    "apps/rustmagic",
    "apps/rustmagic-cli",
    "apps/rustmagic-ibus",
    "xtask",
]

[workspace.package]
version = "0.2.1"
# The five crates the engine is published as. Everything else in this workspace
# carries the app's own layout (keyboard library, IBus service, window) and is
# not something a stranger can consume, so it stays unpublished.

edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-or-later"
repository = "https://github.com/codewiththiha/rustmagic"
authors = ["RustMagic contributors"]

[workspace.dependencies]
km-core = { version = "0.2.1", path = "crates/km-core" }
km-binary = { version = "0.2.1", path = "crates/km-binary" }
km-script = { version = "0.2.1", path = "crates/km-script" }
km-engine = { version = "0.2.1", path = "crates/km-engine" }
km-store = { path = "crates/km-store" }
km-session = { path = "crates/km-session" }
km-ibus = { path = "crates/km-ibus" }
ui-egui = { path = "crates/ui-egui" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
zbus = { version = "5", default-features = false, features = ["async-io"] }
async-io = "2"
egui = "0.29"
# SVG icon loading: resvg rasterises the embedded vectors once per size and
# egui keeps the texture, so the icons stay sharp without a committed bitmap.
egui_extras = { version = "0.29", features = ["svg"] }
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Style calls the project has already made, so the gate stays honest:
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
cast_precision_loss = "allow"
unused_self = "allow"
needless_pass_by_value = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
