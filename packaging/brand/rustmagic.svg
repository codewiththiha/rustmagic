<?xml version="1.0" encoding="UTF-8"?>
<!--
  The application icon: one source, every platform. `tools/package/icons.sh`
  rasterises it into the PNGs, the .ico and (with Apple's iconutil) the .icns.

  It is a rounded square with a keyboard on it, because that is what the program
  is, drawn with the same indigo as the window so the dock, the task bar and the
  app itself look like one thing. The keycaps are cut out rather than drawn on
  top, so the icon still reads at 16 pixels.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="body" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#8f9bff"/>
      <stop offset="0.55" stop-color="#5b62d6"/>
      <stop offset="1" stop-color="#3b3f9e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="keycaps">
      <rect x="0" y="0" width="512" height="512" fill="#fff"/>
      <g fill="#000">
        <rect x="96" y="150" width="46" height="40" rx="10"/>
        <rect x="156" y="150" width="46" height="40" rx="10"/>
        <rect x="216" y="150" width="46" height="40" rx="10"/>
        <rect x="276" y="150" width="46" height="40" rx="10"/>
        <rect x="336" y="150" width="80" height="40" rx="10"/>
        <rect x="96" y="204" width="66" height="40" rx="10"/>
        <rect x="176" y="204" width="46" height="40" rx="10"/>
        <rect x="236" y="204" width="46" height="40" rx="10"/>
        <rect x="296" y="204" width="46" height="40" rx="10"/>
        <rect x="356" y="204" width="60" height="40" rx="10"/>
        <rect x="96" y="258" width="320" height="40" rx="10"/>
        <rect x="96" y="312" width="120" height="40" rx="10"/>
        <rect x="230" y="312" width="186" height="40" rx="10"/>
      </g>
    </mask>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#body)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow)"/>

  <g mask="url(#keycaps)">
    <rect x="80" y="134" width="352" height="234" rx="28" fill="#12131f" opacity="0.62"/>
  </g>

  <!-- The one lit key: the engine's own hue, where a thumb would rest. -->
  <rect x="230" y="312" width="186" height="40" rx="10" fill="#c9cfff" opacity="0.9"/>
</svg>
