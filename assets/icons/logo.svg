    <rect x="3.5" y="3.5" width="17" height="17" rx="5.2" fill="currentColor" fill-opacity="0.16"/>
    <rect x="3.5" y="3.5" width="17" height="17" rx="5.2" stroke="currentColor" stroke-width="1.7"/>
    <path d="M12 7.1 16.9 12 12 16.9 7.1 12Z" fill="currentColor" fill-opacity="0.92"/>
    <path d="M12 7.1 7.1 12h9.8Z" fill="currentColor" fill-opacity="0.38"/>
  </g>
</svg>
