<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- The mark: a slab on a slight tilt, the way the keyboard this engine came
       from drew its own, with a faceted stone cut into it. Obsidian, with the
       accent colour left to the window to supply. -->
