name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  gates:
    name: repository gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: shape, docs and manifests
        run: python3 tools/check_repo.py
      - name: commit subjects
        run: |
          # Every subject in the push, oldest first, checked by the same script
          # the commit-msg hook runs.
          base="${{ github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          failed=0
          for sha in $(git rev-list "$base"..HEAD 2>/dev/null || git rev-list HEAD); do
            subject="$(git log -1 --format=%s "$sha")"
            printf '%s\n\n' "$subject" | python3 tools/check_commit_msg.py - || failed=1
          done
          exit $failed

  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: install linux window dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev
      - name: format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  ibus:
    name: the engine speaks IBus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install IBus and its headers
        run: |
          sudo apt-get update
          sudo apt-get install -y ibus libibus-1.0-dev dbus
      - name: drive the engine with libibus
        # A private session bus, the engine as a service, and a C client that
        # decodes every reply with libibus itself.
        run: dbus-run-session -- tools/smoke/ibus.sh

  arch:
    name: the Arch package builds
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: install the toolchain
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust python dbus ibus
      - uses: actions/checkout@v4
      - name: repository gates
        run: python3 tools/check_repo.py
      - name: build every binary the package ships
        run: |
          cargo build --release --locked \
            --package rustmagic --package rustmagic-cli --package rustmagic-ibus
      - name: check the packaging files
        shell: bash
        run: |
          bash -n packaging/arch/PKGBUILD
          bash -n packaging/arch/PKGBUILD-git
          bash -n packaging/arch/rustmagic.install
          bash -n tools/smoke/ibus.sh
          # makepkg refuses to run as root, so it gets its own copy instead of
          # the checkout. Chowning the checkout would break the runner, which
          # owns files outside the workspace that it must still read.
          useradd -m builder
          install -d -o builder -g builder /tmp/pkg
          cp packaging/arch/PKGBUILD packaging/arch/rustmagic.install /tmp/pkg/
          chown builder:builder /tmp/pkg/PKGBUILD /tmp/pkg/rustmagic.install
          su builder -s /bin/bash -c "cd /tmp/pkg && makepkg --printsrcinfo" > /tmp/pkg/.SRCINFO
          # Print it, so a failed assertion below explains itself.
          cat /tmp/pkg/.SRCINFO
          # .SRCINFO indents every field with a tab; the anchor is the field.
          grep -qE '^pkgbase = rustmagic$' /tmp/pkg/.SRCINFO
          grep -qE '^[[:space:]]*pkgname = rustmagic$' /tmp/pkg/.SRCINFO
          grep -qE '^[[:space:]]*depends = ibus$' /tmp/pkg/.SRCINFO
          grep -qE '^[[:space:]]*install = rustmagic.install$' /tmp/pkg/.SRCINFO
      - name: drive the engine with libibus
        run: dbus-run-session -- tools/smoke/ibus.sh

  abi:
    name: the C ABI links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build the shared library
        run: cargo build -p km-ffi --release
      - name: compile and run the C example
        run: |
          # The example uses the installed header, not a private copy, so a
          # header that drifts from the library fails here.
          tools/smoke/abi.sh
      - name: the header is valid C, C++ and stays warning free
        run: |
          echo '#include "rustmagic.h"' > /tmp/hdr.c
          cp /tmp/hdr.c /tmp/hdr.cpp
          cc -std=c11 -Wall -Wextra -Werror -fsyntax-only \
             -I crates/km-ffi/include /tmp/hdr.c
          cc -std=c99 -Wall -Wextra -Werror -fsyntax-only \
             -I crates/km-ffi/include /tmp/hdr.c
          c++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only \
              -I crates/km-ffi/include /tmp/hdr.cpp
