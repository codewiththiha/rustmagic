name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  gates:
    name: repository gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: shape, docs and manifests
        run: python3 tools/check_repo.py
      - name: commit subjects
        run: |
          # Every subject in the push, oldest first, checked by the same script
          # the commit-msg hook runs.
          base="${{ github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          failed=0
          for sha in $(git rev-list "$base"..HEAD 2>/dev/null || git rev-list HEAD); do
            subject="$(git log -1 --format=%s "$sha")"
            printf '%s\n\n' "$subject" | python3 tools/check_commit_msg.py - || failed=1
          done
          exit $failed

  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: install linux window dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev
      - name: format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  ibus:
    name: the engine speaks IBus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install IBus and its headers
        run: |
          sudo apt-get update
          sudo apt-get install -y ibus libibus-1.0-dev dbus
      - name: drive the engine with libibus
        # A private session bus, the engine as a service, and a C client that
        # decodes every reply with libibus itself.
        run: dbus-run-session -- tools/smoke/ibus.sh

  arch:
    name: the Arch package builds
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: install the toolchain
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust python dbus ibus
      - uses: actions/checkout@v4
      - name: repository gates
        run: python3 tools/check_repo.py
      - name: build every binary the package ships
        run: |
          cargo build --release --locked \
            --package rustmagic --package rustmagic-cli --package rustmagic-ibus
      - name: check the packaging files
        shell: bash
        run: |
          bash -n packaging/arch/PKGBUILD
          bash -n packaging/arch/PKGBUILD-git
          bash -n packaging/arch/rustmagic.install
          bash -n tools/smoke/ibus.sh
          # makepkg refuses to run as root, so it gets its own copy instead of
          # the checkout. Chowning the checkout would break the runner, which
          # owns files outside the workspace that it must still read.
          useradd -m builder
          install -d -o builder -g builder /tmp/pkg
          cp packaging/arch/PKGBUILD packaging/arch/rustmagic.install /tmp/pkg/
          chown builder:builder /tmp/pkg/PKGBUILD /tmp/pkg/rustmagic.install
          su builder -s /bin/bash -c "cd /tmp/pkg && makepkg --printsrcinfo" > /tmp/pkg/.SRCINFO
          # Print it, so a failed assertion below explains itself.
          cat /tmp/pkg/.SRCINFO
          # .SRCINFO indents every field with a tab; the anchor is the field.
          grep -qE '^pkgbase = rustmagic$' /tmp/pkg/.SRCINFO
          grep -qE '^[[:space:]]*pkgname = rustmagic$' /tmp/pkg/.SRCINFO
          grep -qE '^[[:space:]]*depends = ibus$' /tmp/pkg/.SRCINFO
          grep -qE '^[[:space:]]*install = rustmagic.install$' /tmp/pkg/.SRCINFO
      - name: drive the engine with libibus
        run: dbus-run-session -- tools/smoke/ibus.sh

  package:
    name: the installers build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: tools and window dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            librsvg2-bin imagemagick \
            libgl1-mesa-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libxi-dev libxcursor-dev libxrandr-dev libibus-1.0-dev
      - name: build the binaries
        run: |
          cargo build --release --locked \
            --package rustmagic --package rustmagic-cli --package rustmagic-ibus \
            --package km-ffi
      - name: build the .deb and the tarball
        run: python3 tools/package/linux.py --version 0.0.0-ci
      - name: the .deb is a real package
        run: |
          deb=dist/rustmagic_0.0.0-ci_amd64.deb
          test -s "$deb"
          dpkg-deb -f "$deb" Depends | grep -q 'ibus'
          dpkg-deb -f "$deb" Version | grep -qx '0.0.0-ci'
          contents=$(dpkg-deb -c "$deb" | awk '{print $6}')
          for expected in \
              ./usr/bin/rustmagic \
              ./usr/bin/rustmagic-ibus \
              ./usr/share/ibus/component/rustmagic.xml \
              ./usr/share/rustmagic/keyboards/zawgyi.km2 \
              ./usr/include/rustmagic.h \
              ./usr/lib/rustmagic/libkm_ffi.so \
              ./usr/share/doc/rustmagic/OFL-NotoSansMyanmar.txt
          do
            echo "$contents" | grep -qx "$expected" \
              || { echo "::error::$expected is missing from the .deb"; exit 1; }
          done
          echo "$contents"
      - name: the brand icon renders
        run: |
          tools/package/icons.sh dist/brand
          # A renderer that drops gradients or masks produces a blank square,
          # which is still a valid PNG, so the pixels are checked, not the size.
          python3 tools/package/check_icon.py dist/brand

  tsf:
    name: the keyboard speaks TSF
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: build the text service
        run: |
          # CMake builds the engine itself: km-ffi for the MSVC target, linked
          # into the DLL as a static library so there is nothing to ship
          # alongside it.
          cmake -B build/tsf -G "Visual Studio 17 2022" -A x64 `
                -DRUSTMAGIC_FFI_LIB="" platform/windows/tsf
          cmake --build build/tsf --config Release
      - name: it exports what COM looks for and nothing else
        shell: pwsh
        run: |
          $dll = "build/tsf/Release/RustMagicTSF.dll"
          if (-not (Test-Path $dll)) { throw "$dll was not built" }
          # dumpbin is the SDK's tool; the CI image has it on PATH inside a
          # VS developer environment, so read the export table directly instead.
          $bytes = [IO.File]::ReadAllBytes($dll)
          $text = [Text.Encoding]::ASCII.GetString($bytes)
          foreach ($export in @("DllGetClassObject","DllCanUnloadNow","DllRegisterServer","DllUnregisterServer")) {
            if (-not $text.Contains($export)) { throw "$export is missing from $dll" }
          }
          Write-Host "$dll exports the four COM entry points"
      - name: it registers as a keyboard
        shell: pwsh
        run: |
          # regsvr32 is what the installer will call on a user's machine, so the
          # test calls exactly that. -Verb RunAs is not available in CI, and the
          # runner is already an administrator.
          $dll = (Resolve-Path "build/tsf/Release/RustMagicTSF.dll").Path
          $proc = Start-Process -FilePath "regsvr32.exe" -ArgumentList "/s `"$dll`"" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "regsvr32 failed with $($proc.ExitCode)" }
          Write-Host "registered $dll"
      - name: a real TSF manager accepts it
        shell: pwsh
        run: |
          # The smoke test asks Windows itself: the CLSID's InprocServer32, the
          # keyboard category, the language profile, and activation inside a live
          # thread manager. It exits non-zero if any of the four is missing.
          $cl = "cl.exe"
          $vsdevcmd = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vsdevcmd -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=amd64 && cl /nologo /EHsc /std:c++17 /W4 /I platform\windows\tsf /Fe:build\tsf-smoke.exe tools\smoke\tsf.cpp ole32.lib oleaut32.lib advapi32.lib user32.lib"
          if ($LASTEXITCODE -ne 0) { throw "the smoke test did not compile" }
          $dll = (Resolve-Path "build/tsf/Release/RustMagicTSF.dll").Path
          & build/tsf-smoke.exe $dll
          if ($LASTEXITCODE -ne 0) { throw "the text service is not usable" }
      - name: it unregisters cleanly
        shell: pwsh
        run: |
          # A service that cannot be taken out again is a bug of its own: the
          # uninstaller has to leave no CLSID, no profile and no category behind.
          $dll = (Resolve-Path "build/tsf/Release/RustMagicTSF.dll").Path
          $proc = Start-Process -FilePath "regsvr32.exe" -ArgumentList "/u /s `"$dll`"" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "regsvr32 /u failed with $($proc.ExitCode)" }
          $key = "HKLM:\SOFTWARE\Classes\CLSID\{6F1C4A2E-9B31-4C8A-9E1F-2B7D5A0C3A11}"
          if (Test-Path $key) { throw "the CLSID is still registered after uninstall" }
          Write-Host "unregistered, and nothing was left behind"

  tsf-com:
    name: the keyboard registers without Windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: a Windows toolchain and a Windows API
        # mingw builds the DLL on Linux; Wine is what loads it, registers it and
        # answers the TSF questions. This is the half of the Windows story that
        # does not need a Windows machine.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 wine64
      - name: the COM surface and the registration
        run: sh tools/smoke/tsf-com.sh

  ime:
    name: the keyboard speaks InputMethodKit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build the input method
        run: sh platform/macos/ime/build.sh
      - name: the bundle is a bundle
        run: |
          set -eu
          app=build/macos/RustMagicIME.app
          test -x "$app/Contents/MacOS/RustMagicIME"
          # The plist keys are what make macOS treat this as an input method at
          # all; plutil also catches a plist with a syntax error.
          plutil -lint "$app/Contents/Info.plist"
          for key in InputMethodConnectionName InputMethodServerControllerClass \
                     tsInputMethodCharacterRepertoireKey TISIntendedLanguage; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$app/Contents/Info.plist" >/dev/null
          done
          # A signature is not optional: an unsigned input method is never loaded.
          codesign --verify --deep --strict "$app"
          # The engine is inside the bundle and referenced by rpath, so the app
          # does not depend on the machine that built it.
          otool -L "$app/Contents/MacOS/RustMagicIME" | grep -q '@rpath/libkm_ffi.dylib'
          if otool -L "$app/Contents/MacOS/RustMagicIME" | grep -q "$PWD"; then
            echo "::error::the executable still points into the build tree"
            exit 1
          fi
          test -s "$app/Contents/Frameworks/libkm_ffi.dylib"
          # The five bundled layouts travel with it, so a fresh install types.
          test "$(ls "$app/Contents/Resources/keyboards"/*.km2 | wc -l)" -eq 5
      - name: macOS accepts it as an input method
        run: |
          set -eu
          mkdir -p "$HOME/Library/Input Methods"
          cp -R build/macos/RustMagicIME.app "$HOME/Library/Input Methods/"
          swiftc -O -framework Carbon tools/smoke/tis.swift -o build/tis-smoke
          # The test selects the input method and puts the previous one back, so
          # a developer running it on a laptop is not left in Burmese mode.
          ./build/tis-smoke
      - name: it unloads when removed
        run: |
          set -eu
          rm -rf "$HOME/Library/Input Methods/RustMagicIME.app"
          killall -HUP TextInputMenuAgent || true
          # Nothing may keep the bundle mapped or hold a handler for it.
          if pgrep -f RustMagicIME.app/Contents/MacOS/RustMagicIME >/dev/null; then
            echo "::error::the input method is still running after being removed"
            exit 1
          fi
          echo "removed, and nothing was left running"

  abi:
    name: the C ABI links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build the shared library
        run: cargo build -p km-ffi --release
      - name: compile and run the C example
        run: |
          # The example uses the installed header, not a private copy, so a
          # header that drifts from the library fails here.
          tools/smoke/abi.sh
      - name: the header is valid C, C++ and stays warning free
        run: |
          echo '#include "rustmagic.h"' > /tmp/hdr.c
          cp /tmp/hdr.c /tmp/hdr.cpp
          cc -std=c11 -Wall -Wextra -Werror -fsyntax-only \
             -I crates/km-ffi/include /tmp/hdr.c
          cc -std=c99 -Wall -Wextra -Werror -fsyntax-only \
             -I crates/km-ffi/include /tmp/hdr.c
          c++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only \
              -I crates/km-ffi/include /tmp/hdr.cpp
