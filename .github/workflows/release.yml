name: release

# Cut a release by pushing a tag:
#
#     cargo xtask release 0.2.0      # bumps the version and tags
#     git push origin main --tags    # or push the tag alone
#
# Everything below runs from the tag, so an artifact can always be traced back to
# the commit and the version it was built from. Each job uploads into one draft
# release; the last job publishes it once every target has landed.
#
# What ships, per platform, is what that platform's users install with:
#
#   Windows   .exe (Inno Setup), .msi (WiX), portable .zip
#   macOS     .dmg (drag to Applications), portable .zip
#   Debian    .deb (apt install ./file.deb)
#   Fedora    .rpm (dnf install ./file.rpm)
#   Arch      .pkg.tar.zst (pacman -U), plus the PKGBUILD that rebuilds it
#   anyone    .tar.gz prefix

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for example v0.2.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # One rasteriser for every platform: the .ico Windows needs and the PNG that
  # macOS turns into a .icns both come from packaging/brand/rustmagic.svg here,
  # so the repository never carries a bitmap that can drift from the drawing.
  brand:
    name: brand icons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: rasterise the icon
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin imagemagick
          tools/package/icons.sh dist/brand
      - uses: actions/upload-artifact@v4
        with:
          name: brand
          path: dist/brand

  linux:
    name: linux (.deb, .tar.gz)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: resolve the version
        id: version
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: window and IBus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libxi-dev libxcursor-dev libxrandr-dev libibus-1.0-dev ibus dbus
      - name: build
        run: |
          cargo build --release --locked \
            --package rustmagic --package rustmagic-cli --package rustmagic-ibus \
            --package km-ffi
      - name: test before shipping
        run: cargo test --release --locked --workspace
      - name: exercise the engine over D-Bus
        run: dbus-run-session -- tools/smoke/ibus.sh
      - name: package
        run: python3 tools/package/linux.py --version "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/rustmagic-*.tar.gz
            dist/rustmagic-*.sha256
            dist/rustmagic_*.deb
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          files: |
            dist/rustmagic-*.tar.gz
            dist/rustmagic-*.sha256
            dist/rustmagic_*.deb

  linux-cross:
    name: linux (${{ matrix.arch }}, ${{ matrix.flavour }})
    runs-on: ubuntu-latest
    needs: brand
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
            flavour: gnu
            package_deb: true
          - target: x86_64-unknown-linux-musl
            arch: x86_64
            flavour: musl
            package_deb: false
          - target: aarch64-unknown-linux-musl
            arch: aarch64
            flavour: musl
            package_deb: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: brand
          path: dist/brand
      - name: resolve the version
        id: version
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: cross, pinned
        # `cross` brings the linker, the sysroot and, for the GNU target, the qemu
        # it needs to run the tests it just built.
        run: |
          curl -fsSL -o /tmp/cross.tar.gz \
            https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/cross.tar.gz -C /tmp
          install -m755 /tmp/cross "$HOME/.cargo/bin/cross"
          cross --version
      - name: build every binary for ${{ matrix.target }}
        run: |
          cross build --release --locked --target "${{ matrix.target }}" \
            --package rustmagic --package rustmagic-cli \
            --package rustmagic-ibus --package km-ffi
      - name: test what can run here
        # qemu comes with cross for the GNU target; a musl build is a build, not
        # a run, in this job.
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cross test --release --locked --target "${{ matrix.target }}" \
              -p km-core -p km-binary -p km-script -p km-engine -p km-store -p km-session
          else
            echo "no runner for ${{ matrix.target }}: the build is the check"
          fi
      - name: package
        run: |
          version="${{ steps.version.outputs.version }}"
          extra=""
          if [ "${{ matrix.package_deb }}" != "true" ]; then
            extra="--no-deb"
          fi
          python3 tools/package/linux.py --version "$version" \
            --bin-dir "target/${{ matrix.target }}/release" \
            --arch "${{ matrix.arch }}" --flavour "${{ matrix.flavour }}" $extra
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.deb

  rpm:
    name: fedora (.rpm)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: resolve the version
        id: version
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: rpmbuild
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build the package from the tag
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist
          curl -fsSL -o "dist/rustmagic-$version.tar.gz" \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v$version.tar.gz"
          # `--nodeps` because the spec's BuildRequires name the distribution's
          # cargo and rust packages, and this runner's toolchain comes from
          # rustup instead: rpmbuild would refuse a build it can do perfectly
          # well. A `dnf builddep` from Fedora still reads those requirements.
          rpmbuild -bb --nodeps packaging/rpm/rustmagic.spec \
            --define "version $version" \
            --define "_sourcedir $PWD/dist" \
            --define "_topdir $PWD/dist/rpmbuild"
          find dist/rpmbuild/RPMS -name '*.rpm' -exec cp {} dist/ \;
          ls -l dist/*.rpm
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          files: dist/*.rpm

  macos:
    name: macos (.dmg, universal)
    runs-on: macos-latest
    needs: brand
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: brand
          path: dist/brand
      - name: resolve the version
        id: version
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: build both architectures
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$target" \
              --package rustmagic --package rustmagic-cli --package km-ffi
          done
      - name: test on the host architecture
        run: cargo test --release --locked -p km-core -p km-binary -p km-script -p km-engine -p km-store -p km-session -p ui-egui
      - name: build the input method
        # The keyboard macOS calls an input source. Universal, like the app, so
        # one download runs on Intel and Apple silicon.
        run: UNIVERSAL=1 sh platform/macos/ime/build.sh dist/ime
      - name: assemble the app
        run: |
          version="${{ steps.version.outputs.version }}"
          out="dist/rustmagic-$version-macos-universal"
          app="$out/RustMagic.app/Contents"
          mkdir -p "$app/MacOS" "$app/Resources" "$out/bin" "$out/lib"
          for binary in rustmagic rustmagic-cli; do
            lipo -create -output "$out/bin/$binary" \
              "target/aarch64-apple-darwin/release/$binary" \
              "target/x86_64-apple-darwin/release/$binary"
          done
          lipo -create -output "$out/lib/libkm_ffi.dylib" \
            target/aarch64-apple-darwin/release/libkm_ffi.dylib \
            target/x86_64-apple-darwin/release/libkm_ffi.dylib
          # lipo exits 0 even when it produced one slice, so the architectures
          # are read back and checked.
          for fat in "$out/bin/rustmagic" "$out/bin/rustmagic-cli" "$out/lib/libkm_ffi.dylib"; do
            archs=$(lipo -archs "$fat")
            case "$archs" in
              *x86_64*arm64* | *arm64*x86_64*) echo "universal: $fat ($archs)" ;;
              *) echo "not universal: $fat ($archs)"; exit 1 ;;
            esac
          done
          install -m755 "$out/bin/rustmagic" "$app/MacOS/RustMagic"
          install -m644 packaging/macos/Info.plist "$app/Info.plist"
          printf 'APPL????' > "$app/PkgInfo"
          install -m644 crates/km-ffi/include/rustmagic.h "$out/lib/"
          mkdir -p "$app/Resources/keyboards"
          install -m644 keyboards/bundled/*.km2 "$app/Resources/keyboards/"
          install -m644 README.md LICENSE "$out/"
          install -m644 assets/fonts/OFL.txt "$out/OFL-NotoSansMyanmar.txt"
          install -m644 assets/fonts/OFL.txt "$app/Resources/OFL-NotoSansMyanmar.txt"
          # The input method goes in the same download, next to the app, with the
          # one command that installs it.
          install -d "$out/Input Methods"
          cp -R dist/ime/RustMagicIME.app "$out/Input Methods/"
          cp platform/macos/ime/install-ime.sh "$out/Input Methods/"
          chmod +x "$out/Input Methods/install-ime.sh"
          # The .icns comes from the one brand PNG, through Apple's own tools.
          iconset="$(mktemp -d)/RustMagic.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z $size $size dist/brand/rustmagic-1024.png \
              --out "$iconset/icon_${size}x${size}.png" >/dev/null
            sips -z $((size * 2)) $((size * 2)) dist/brand/rustmagic-1024.png \
              --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Resources/RustMagic.icns"
          cat <<'TXT' | sed 's/^          //' > "$out/INSTALL.txt"
          RustMagic on macOS

            RustMagic.dmg        drag RustMagic.app to Applications
            bin/rustmagic-cli    the command line front end
            lib/libkm_ffi.dylib  the C ABI, for another input-method framework

          Typing everywhere: Input Methods/RustMagicIME.app is an InputMethodKit
          input method. Run "Input Methods/install-ime.sh" once, then add
          RustMagic in System Settings > Keyboard > Input Sources (Burmese or
          English), and it types in every application with whichever keyboard is
          active in the RustMagic window.

          The app is unsigned, so the first launch needs right-click, Open.
          TXT
      - name: sign and notarise, when Apple lets us
        # Without a Developer ID certificate this is a no-op and the bundle ships
        # unsigned, which is what the release notes then say. With one, the app is
        # signed with the hardened runtime, notarised, and the ticket stapled, so
        # the first launch is a double-click instead of right-click, Open.
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu
          version="${{ steps.version.outputs.version }}"
          bundle="dist/rustmagic-$version-macos-universal/RustMagic.app"
          ime="dist/rustmagic-$version-macos-universal/Input Methods/RustMagicIME.app"
          if [ -z "${CERTIFICATE:-}" ]; then
            echo "::notice::no Apple certificate, so the app ships unsigned"
            exit 0
          fi
          keychain=$(mktemp -d)/rustmagic.keychain-db
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          security import /tmp/certificate.p12 -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f /tmp/certificate.p12
          codesign --force --deep --timestamp --options runtime \
            --sign "$SIGNING_IDENTITY" "$bundle"
          codesign --verify --deep --strict --verbose=2 "$bundle"
          # The input method is a separate bundle, loaded by other applications,
          # so it needs its own signature and its own notarisation ticket.
          codesign --force --deep --timestamp --options runtime \
            --sign "$SIGNING_IDENTITY" "$ime"
          codesign --verify --deep --strict --verbose=2 "$ime"
          if [ -z "${APPLE_ID:-}" ]; then
            echo "::notice::no notarytool credentials, so the app is signed but not notarised"
            exit 0
          fi
          ditto -c -k --keepParent "$bundle" /tmp/notarise.zip
          ditto -c -k --keepParent "$ime" /tmp/notarise-ime.zip
          xcrun notarytool submit /tmp/notarise.zip \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APPLE_PASSWORD" \
            --wait
          xcrun stapler staple "$bundle"
          xcrun stapler validate "$bundle"
          xcrun notarytool submit /tmp/notarise-ime.zip \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APPLE_PASSWORD" \
            --wait
          xcrun stapler staple "$ime"
          xcrun stapler validate "$ime"
          security delete-keychain "$keychain"
      - name: make the disk image and the archive
        run: |
          version="${{ steps.version.outputs.version }}"
          out="dist/rustmagic-$version-macos-universal"
          tools/package/dmg.sh "$version" "$out/RustMagic.app" \
            "dist/RustMagic-$version-universal.dmg" "$out/Input Methods"
          zip -qry "$out.zip" "$out"
          shasum -a 256 "$out.zip" > "$out.zip.sha256"
          ls -l dist/*.dmg dist/*.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          files: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*.zip
            dist/*.zip.sha256

  windows:
    name: windows (.exe, .msi, .zip)
    runs-on: windows-latest
    needs: brand
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: brand
          path: dist/brand
      - name: resolve the version
        id: version
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: build
        run: |
          cargo build --release --locked --package rustmagic --package rustmagic-cli --package km-ffi
      - name: test before shipping
        run: cargo test --release --locked -p km-core -p km-binary -p km-script -p km-engine -p km-store -p km-session -p ui-egui
      - name: build the text service
        # The keyboard Windows calls an input method. Built here, next to the
        # binaries, so the installers ship a DLL that matches them. Inside
        # Visual Studio's developer environment, because the IDE generator
        # cannot find the IDE on this image.
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "no Visual Studio C++ tools on this runner" }
          $icon = (Resolve-Path "dist/brand/rustmagic.ico").Path
          cmd /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=amd64 -host_arch=amd64 && cmake -S platform/windows/tsf -B build/tsf -G Ninja -DCMAKE_BUILD_TYPE=Release -DRUSTMAGIC_ICON=`"$icon`" && cmake --build build/tsf"
          if ($LASTEXITCODE -ne 0) { throw "the text service did not build" }
      - name: assemble
        shell: bash
        run: |
          out="dist/windows"
          mkdir -p "$out/keyboards"
          cp target/release/rustmagic.exe target/release/rustmagic-cli.exe "$out/"
          cp target/release/km_ffi.dll "$out/"
          cp build/tsf/RustMagicTSF.dll "$out/"
          cp crates/km-ffi/include/rustmagic.h "$out/"
          cp keyboards/bundled/*.km2 "$out/keyboards/"
          cp README.md LICENSE "$out/"
          # The Myanmar face is compiled into the binaries, so its licence is
          # handed out with them.
          cp assets/fonts/OFL.txt "$out/OFL-NotoSansMyanmar.txt"
          cp dist/brand/rustmagic.ico "$out/"
          cat <<'TXT' | sed 's/^          //' > "$out/INSTALL.txt"
          RustMagic on Windows

            rustmagic.exe       the manager window
            rustmagic-cli.exe   the command line front end, no window needed
            km_ffi.dll          the engine's C ABI, for other input-method services
            rustmagic.h         its header
            RustMagicTSF.dll    the keyboard Windows itself uses (see below)
            keyboards\          the five Myanmar layouts that ship with it

          Typing everywhere: RustMagicTSF.dll is a TSF text service. The
          installer registers it, so RustMagic appears under Settings ->
          Language & region -> <language> -> Keyboards and in the language bar,
          and types with whichever keyboard is active in this window. Typing it
          into other applications needs no extra step; Win+Space switches to it.

          platform\windows\tsf\INSTALL.txt in the source tree explains the
          registration and lists what the test suite can and cannot prove.
          TXT
      - name: sign, when there is a certificate
        # Authenticode, and a timestamp, so the signature outlives the
        # certificate. No certificate means unsigned installers and a SmartScreen
        # warning, which the release notes say out loud.
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -eu
          if [ -z "${CERTIFICATE:-}" ]; then
            echo "::notice::no Authenticode certificate, so the installers ship unsigned"
            exit 0
          fi
          # Not `ls ... | tail -1`: the runner runs this shell with `pipefail`,
          # and a path that does not exist makes ls exit 2, which ends the step
          # before the message that explains why.
          signtool=""
          for candidate in "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe \
                           "/c/Program Files (x86)/Windows Kits/8.1/bin/x64/signtool.exe"; do
            if [ -x "$candidate" ]; then signtool="$candidate"; fi
          done
          if [ -z "$signtool" ]; then
            echo "::error::signtool is not on this runner"
            exit 1
          fi
          printf '%s' "$CERTIFICATE" | base64 --decode > certificate.pfx
          for file in dist/windows/rustmagic.exe dist/windows/rustmagic-cli.exe \
                      dist/windows/km_ffi.dll dist/windows/RustMagicTSF.dll; do
            "$signtool" sign /fd sha256 /td sha256 /tr http://timestamp.digicert.com \
              /f certificate.pfx /p "$CERTIFICATE_PASSWORD" "$file"
          done
          rm -f certificate.pfx
      - name: install the installer builders
        # Neither Inno Setup nor WiX ships on every windows image, and which one
        # is missing changes with the image rather than with this repository.
        # Both are installed only if absent, and the later steps use absolute
        # paths, because a PATH that choco edits does not reach this process.
        shell: pwsh
        run: |
          $inno = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $inno) {
            Write-Host "Inno Setup is absent; installing it"
            choco install innosetup --no-progress -y
          } else {
            Write-Host "Inno Setup is already here: $inno"
          }
          $wix = @(
            "C:\Program Files (x86)\WiX Toolset v3.14\bin\candle.exe",
            "C:\Program Files (x86)\WiX Toolset v3.11\bin\candle.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $wix) {
            Write-Host "WiX Toolset is absent; installing it"
            choco install wixtoolset --no-progress -y
          } else {
            Write-Host "WiX Toolset is already here: $wix"
          }
      - name: installer (.exe)
        shell: bash
        run: |
          set -e
          # Same reason as the signtool lookup: `ls` over two paths, one of them
          # absent, exits 2 under `pipefail` and takes the step with it.
          iscc=""
          for candidate in "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
                           "/c/Program Files/Inno Setup 6/ISCC.exe"; do
            if [ -x "$candidate" ]; then iscc="$candidate"; break; fi
          done
          if [ -z "$iscc" ]; then
            echo "::error::Inno Setup is not on this runner"
            exit 1
          fi
          "$iscc" "/DMyAppVersion=${{ steps.version.outputs.version }}" packaging/windows/rustmagic.iss
          ls -l dist/*.exe
      - name: installer (.msi)
        shell: pwsh
        run: |
          $wix = @(
            "C:\Program Files (x86)\WiX Toolset v3.14\bin",
            "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          ) | Where-Object { Test-Path "$_\candle.exe" } | Select-Object -First 1
          if (-not $wix) {
            throw "WiX Toolset is not on this runner"
          }
          & "$wix\candle.exe" -nologo -dVersion="${{ steps.version.outputs.version }}" `
            -out dist\rustmagic.wixobj packaging\windows\rustmagic.wxs
          & "$wix\light.exe" -nologo -ext WixUIExtension `
            -out "dist\RustMagic-${{ steps.version.outputs.version }}-x64.msi" dist\rustmagic.wixobj
      - name: sign the installers
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -eu
          if [ -z "${CERTIFICATE:-}" ]; then
            echo "::notice::no Authenticode certificate, so the installers ship unsigned"
            exit 0
          fi
          # Not `ls ... | tail -1`: the runner runs this shell with `pipefail`,
          # and a path that does not exist makes ls exit 2, which ends the step
          # before the message that explains why.
          signtool=""
          for candidate in "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe \
                           "/c/Program Files (x86)/Windows Kits/8.1/bin/x64/signtool.exe"; do
            if [ -x "$candidate" ]; then signtool="$candidate"; fi
          done
          printf '%s' "$CERTIFICATE" | base64 --decode > certificate.pfx
          for file in dist/*Setup*.exe dist/*.msi; do
            "$signtool" sign /fd sha256 /td sha256 /tr http://timestamp.digicert.com \
              /f certificate.pfx /p "$CERTIFICATE_PASSWORD" "$file"
          done
          rm -f certificate.pfx
      - name: portable archive
        shell: bash
        run: |
          cd dist
          mv windows "rustmagic-${{ steps.version.outputs.version }}-windows-x86_64"
          zip -qr "rustmagic-${{ steps.version.outputs.version }}-windows-x86_64.zip" \
            "rustmagic-${{ steps.version.outputs.version }}-windows-x86_64"
          sha256sum *.zip > "rustmagic-${{ steps.version.outputs.version }}-windows-x86_64.zip.sha256"
          ls -l *.zip *.exe *.msi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          files: |
            dist/*Setup*.exe
            dist/*.msi
            dist/*windows-x86_64.zip
            dist/*windows-x86_64.zip.sha256

  arch:
    name: arch (.pkg.tar.zst)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: toolchain and runtime dependencies
        # `makepkg` refuses to run as root, and it should not need sudo for
        # anything, so everything the package depends on is installed first.
        run: pacman -Syu --noconfirm --needed base-devel git curl rust ibus python dbus
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: resolve the version
        id: version
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: build the package from the tag
        run: |
          version="${{ steps.version.outputs.version }}"
          # makepkg refuses to run as root, so it runs as a builder user that
          # owns a copy of the packaging files and the source archive.
          useradd -m builder
          install -d -o builder -g builder /home/builder/build
          cp packaging/arch/PKGBUILD packaging/arch/rustmagic.install /home/builder/build/
          chown -R builder:builder /home/builder/build
          cd /home/builder/build
          sed -i "s/^pkgver=.*/pkgver=$version/" PKGBUILD
          # The source archive of the tag is downloaded here and shipped beside
          # the package. Because `source=()` names that exact file, `makepkg -si`
          # in the download directory verifies a checksum instead of hoping that
          # GitHub's archive of a tag never changes.
          curl -fsSL -o "rustmagic-$version.tar.gz" \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v$version.tar.gz"
          checksum=$(sha256sum "rustmagic-$version.tar.gz" | cut -d' ' -f1)
          sed -i "s|^source=.*|source=(\"rustmagic-\$pkgver.tar.gz\")|" PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('$checksum')/" PKGBUILD
          # No `--nocheck`: a user running `makepkg -si` runs `check()`, so the
          # release runs it too. A package whose own test suite fails for
          # everyone who builds it is not a package that installs.
          su builder -s /bin/bash -c "cd /home/builder/build && makepkg --noconfirm"
          su builder -s /bin/bash -c "cd /home/builder/build && makepkg --printsrcinfo > .SRCINFO"
          # The download is the package, the two files that rebuild it, and the
          # source they name -- all with the names makepkg expects.
          mkdir -p /tmp/assets
          cp /home/builder/build/rustmagic-"$version"-*.pkg.tar.zst /tmp/assets/
          cp /home/builder/build/PKGBUILD /tmp/assets/PKGBUILD
          cp /home/builder/build/rustmagic.install /tmp/assets/rustmagic.install
          cp /home/builder/build/.SRCINFO "/tmp/assets/rustmagic-$version.SRCINFO"
          cp "/home/builder/build/rustmagic-$version.tar.gz" /tmp/assets/
          # Then install it, the way the release notes tell an Arch user to.
          # ibus is assumed installed rather than required: the container has no
          # session to run it in, and the dependency is declared in the package.
          pacman -U --noconfirm --assume-installed ibus \
            "/home/builder/build/rustmagic-$version"-1-x86_64.pkg.tar.zst
          test -x /usr/bin/rustmagic
          test -f /usr/share/ibus/component/rustmagic.xml
          test -x /usr/bin/rustmagic-cli
          rustmagic-cli list | head
          pacman -Q rustmagic
          ls -l /tmp/assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          files: /tmp/assets/*

  crates:
    name: crates.io
    runs-on: ubuntu-latest
    # A registry outage must not hold back a security release, so this job is
    # not a dependency of `publish`. A failure here is still a red release.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: the tests the registry never sees
        run: |
          cargo test --locked -q \
            -p km-core -p km-binary -p km-script -p km-engine -p km-ffi
      - name: publish the five engine crates, in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            # A secret this repository does not have says nothing about the code
            # in the tag, and the release notes already say crates.io is not part
            # of this release. Reddening the whole run for a setting would teach
            # people to ignore a red release.
            echo "::warning::CARGO_REGISTRY_TOKEN is not set, so the crates are not published"
            echo "Add it under Settings -> Secrets -> Actions to publish them here."
            exit 0
          fi
          python3 tools/publish_crates.py

  publish:
    name: publish the release
    needs: [linux, linux-cross, rpm, macos, windows, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # On a tag push this is the tag; on a manual run it is the tag that
          # was asked for. Either way the source is what the version names.
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: sign every asset, when a key is configured
        # Detached signatures, one per file, plus the public key and a checksum
        # file that is itself signed. This runs in one job because it is the only
        # job that can see the whole draft; a signature made per platform would
        # mean five keys to collect.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::notice::GPG_PRIVATE_KEY is not set, so this release carries no signatures"
            exit 0
          fi
          mkdir -p signed
          cd signed
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir . --clobber
          files=$(find . -maxdepth 1 -type f \
            ! -name '*.asc' ! -name '*.sha256' ! -name 'SHA256SUMS' \
            -printf '%f\n' | sort)
          [ -n "$files" ] || { echo "::error::the draft has no assets to sign"; exit 1; }
          # shellcheck disable=SC2086
          sh "$GITHUB_WORKSPACE/tools/package/sign.sh" sign $files
          # shellcheck disable=SC2086
          sha256sum $files > SHA256SUMS
          sh "$GITHUB_WORKSPACE/tools/package/sign.sh" sign SHA256SUMS
          # A signature nobody can check without hunting for the key is theatre.
          # shellcheck disable=SC2086
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            SHA256SUMS SHA256SUMS.asc rustmagic-signing-key.asc *.asc
          ls -l
      - name: check every target landed, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          # Read only to write an accurate "not in this release" section.
          REGISTRY: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          APPLE: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          WINDOWS: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
        run: |
          # A draft release whose assets are missing a platform is worse than no
          # release, so the count is checked before anything becomes public.
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                     --json assets --jq '.assets[].name')
          echo "$assets"
          for expected in \
              linux-x86_64.tar.gz \
              linux-aarch64.tar.gz \
              linux-x86_64-musl.tar.gz \
              linux-aarch64-musl.tar.gz \
              _amd64.deb \
              _arm64.deb \
              .rpm \
              .dmg \
              Setup-x64.exe \
              x64.msi \
              pkg.tar.zst \
              PKGBUILD
          do
            if ! echo "$assets" | grep -q "$expected"; then
              echo "::error::the release has no $expected artifact"
              exit 1
            fi
          done
          notes=$(mktemp)
          cat <<'TXT' | sed 's/^          //' > "$notes"
          One engine, and an installer for every platform, built from the tag.

          | Platform | Download | Install with |
          | --- | --- | --- |
          | Windows | `RustMagic-<v>-Setup-x64.exe` | run it |
          | Windows (managed) | `RustMagic-<v>-x64.msi` | `msiexec /i`, Group Policy, Intune |
          | macOS (universal) | `RustMagic-<v>-universal.dmg` | open, drag to Applications |
          | Debian, Ubuntu (x86-64) | `rustmagic_<v>_amd64.deb` | `sudo apt install ./rustmagic_<v>_amd64.deb` |
          | Debian, Ubuntu (ARM64) | `rustmagic_<v>_arm64.deb` | `sudo apt install ./rustmagic_<v>_arm64.deb` |
          | Fedora, RHEL | `rustmagic-<v>-1.x86_64.rpm` | `sudo dnf install ./rustmagic-<v>-1.x86_64.rpm` |
          | Arch | `rustmagic-<v>-1-x86_64.pkg.tar.zst` | `sudo pacman -U` |
          | Arch (from source) | `PKGBUILD` + `rustmagic.install` + `rustmagic-<v>.tar.gz` | `makepkg -si` |
          | Alpine, static | `rustmagic-<v>-linux-x86_64-musl.tar.gz` | unpack and run, no libc to match |
          | ARM64, static | `rustmagic-<v>-linux-aarch64-musl.tar.gz` | the same |
          | anywhere | `.tar.gz` / `.zip` | unpack and run |

          Every release carries five Myanmar keyboards — Pyidaungsu MM, my-Win
          2.3.0, MyanSan, Zawgyi and ZawCode — embedded in the binaries, so a
          fresh install types without downloading anything.

          Every file has a `.sha256` next to it, a detached GPG signature
          (`<file>.asc`), and there is a signed `SHA256SUMS`. Verify with:

          ```
          gpg --import rustmagic-signing-key.asc
          gpg --verify SHA256SUMS.asc SHA256SUMS
          sha256sum -c SHA256SUMS
          ```

          The Windows installers are Authenticode-signed and timestamped, and the
          macOS app is signed with a Developer ID and notarised, whenever the
          release carries the certificates for them. If a release does not, the
          `.asc` files are still there and the notes say so.

          Every installer also makes RustMagic the system input method, not just
          an application: the Windows `.exe` and `.msi` register `RustMagicTSF.dll`
          as a Text Services Framework text service, so it appears under the
          language in Settings and types in every program; the macOS `.dmg`
          carries the InputMethodKit bundle in `Input Methods/`, so it appears in
          System Settings under Input Sources; the Linux packages install the
          IBus component. The five bundled keyboards are the same in all three.

          Details, including how to cut the next one: `docs/RELEASING.md`.
          TXT
          sed -i "s/<v>/${TAG#v}/g" "$notes"
          # The gaps are the part of a release note that goes stale first, so they
          # are computed from what this run actually had: a secret that is absent
          # is a sentence, and a secret that is present is a different sentence.
          {
            echo
            echo "**Not in this release.**"
            echo
            if [ -n "${REGISTRY:-}" ]; then
              echo "- The five engine crates (\`km-core\`, \`km-binary\`, \`km-script\`,"
              echo "  \`km-engine\`, \`km-ffi\`) are published to crates.io under this version."
            else
              echo "- The five engine crates (\`km-core\`, \`km-binary\`, \`km-script\`,"
              echo "  \`km-engine\`, \`km-ffi\`) are **not** on crates.io: publishing needs a"
              echo "  \`CARGO_REGISTRY_TOKEN\` secret, and this repository has none set. The"
              echo "  crates build and pass their tests in this run all the same."
            fi
            if [ -n "${APPLE:-}" ]; then
              echo "- The macOS app is signed with a Developer ID and notarised."
            else
              echo "- The macOS app is signed ad hoc only: no Developer ID certificate is"
              echo "  configured, so a downloaded copy has to be let past Gatekeeper once"
              echo "  (right-click then Open, or \`xattr -dr com.apple.quarantine\`)."
            fi
            if [ -n "${WINDOWS:-}" ]; then
              echo "- The Windows installers are Authenticode-signed and timestamped."
            else
              echo "- The Windows installers are unsigned: no Authenticode certificate is"
              echo "  configured, so SmartScreen will warn once on first run."
            fi
            echo "- The Windows text service and the macOS input method are registered by"
            echo "  their installers, and CI proves that much on a real Windows runner and"
            echo "  against Text Input Source Services on macOS. **No keystroke has been"
            echo "  watched landing in a real document on either of them.** That check is a"
            echo "  human one, written down in \`platform/windows/tsf/INSTALL.txt\` and"
            echo "  \`platform/macos/ime/INSTALL.txt\`."
          } >> "$notes"
          # The package names carry the pkgrel, so they are read from the upload.
          deb=$(echo "$assets" | grep '_amd64\.deb' | head -1)
          deb_arm=$(echo "$assets" | grep '_arm64\.deb' | head -1)
          rpm=$(echo "$assets" | grep '\.rpm' | head -1)
          arch=$(echo "$assets" | grep 'pkg\.tar\.zst' | head -1)
          sed -i "s/rustmagic_<v>_arm64\.deb/$deb_arm/g; s/rustmagic_<v>_amd64\.deb/$deb/g; s/rustmagic-<v>-1\.x86_64\.rpm/$rpm/g; s/rustmagic-<v>-1-x86_64\.pkg\.tar\.zst/$arch/g" "$notes"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false \
            --title "RustMagic ${TAG#v}" --notes-file "$notes"
