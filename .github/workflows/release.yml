name: release

# Cut a release by pushing a tag:
#
#     cargo xtask release 0.2.0      # bumps the version and tags
#     git push origin main --tags    # or push the tag alone
#
# Everything below runs from the tag, so an artifact can always be traced back to
# the commit and the version it was built from. Each job uploads into one draft
# release; the last job publishes it once every target has landed.
#
# What ships, per platform, is what that platform's users install with:
#
#   Windows   .exe (Inno Setup), .msi (WiX), portable .zip
#   macOS     .dmg (drag to Applications), portable .zip
#   Debian    .deb (apt install ./file.deb)
#   Fedora    .rpm (dnf install ./file.rpm)
#   Arch      .pkg.tar.zst (pacman -U), plus the PKGBUILD that rebuilds it
#   anyone    .tar.gz prefix

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for example v0.2.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # One rasteriser for every platform: the .ico Windows needs and the PNG that
  # macOS turns into a .icns both come from packaging/brand/rustmagic.svg here,
  # so the repository never carries a bitmap that can drift from the drawing.
  brand:
    name: brand icons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: rasterise the icon
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin imagemagick
          tools/package/icons.sh dist/brand
      - uses: actions/upload-artifact@v4
        with:
          name: brand
          path: dist/brand

  linux:
    name: linux (.deb, .tar.gz)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: resolve the version
        id: version
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: window and IBus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libxi-dev libxcursor-dev libxrandr-dev libibus-1.0-dev ibus dbus
      - name: build
        run: |
          cargo build --release --locked \
            --package rustmagic --package rustmagic-cli --package rustmagic-ibus \
            --package km-ffi
      - name: test before shipping
        run: cargo test --release --locked --workspace
      - name: exercise the engine over D-Bus
        run: dbus-run-session -- tools/smoke/ibus.sh
      - name: package
        run: python3 tools/package/linux.py --version "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/rustmagic-*.tar.gz
            dist/rustmagic-*.sha256
            dist/rustmagic_*.deb
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          files: |
            dist/rustmagic-*.tar.gz
            dist/rustmagic-*.sha256
            dist/rustmagic_*.deb

  rpm:
    name: fedora (.rpm)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: resolve the version
        id: version
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: rpmbuild
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build the package from the tag
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist
          curl -fsSL -o "dist/rustmagic-$version.tar.gz" \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v$version.tar.gz"
          # The spec builds from the source archive, so the .rpm is a real
          # build of the tag and not a repack of somebody else's binary.
          rpmbuild -bb packaging/rpm/rustmagic.spec \
            --define "version $version" \
            --define "_sourcedir $PWD/dist" \
            --define "_topdir $PWD/dist/rpmbuild"
          find dist/rpmbuild/RPMS -name '*.rpm' -exec cp {} dist/ \;
          ls -l dist/*.rpm
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          files: dist/*.rpm

  macos:
    name: macos (.dmg, universal)
    runs-on: macos-latest
    needs: brand
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: brand
          path: dist/brand
      - name: resolve the version
        id: version
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: build both architectures
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$target" \
              --package rustmagic --package rustmagic-cli --package km-ffi
          done
      - name: test on the host architecture
        run: cargo test --release --locked -p km-core -p km-binary -p km-script -p km-engine -p km-store -p km-session -p ui-egui
      - name: assemble the app
        run: |
          version="${{ steps.version.outputs.version }}"
          out="dist/rustmagic-$version-macos-universal"
          app="$out/RustMagic.app/Contents"
          mkdir -p "$app/MacOS" "$app/Resources" "$out/bin" "$out/lib"
          for binary in rustmagic rustmagic-cli; do
            lipo -create -output "$out/bin/$binary" \
              "target/aarch64-apple-darwin/release/$binary" \
              "target/x86_64-apple-darwin/release/$binary"
          done
          lipo -create -output "$out/lib/libkm_ffi.dylib" \
            target/aarch64-apple-darwin/release/libkm_ffi.dylib \
            target/x86_64-apple-darwin/release/libkm_ffi.dylib
          # lipo exits 0 even when it produced one slice, so the architectures
          # are read back and checked.
          for fat in "$out/bin/rustmagic" "$out/bin/rustmagic-cli" "$out/lib/libkm_ffi.dylib"; do
            archs=$(lipo -archs "$fat")
            case "$archs" in
              *x86_64*arm64* | *arm64*x86_64*) echo "universal: $fat ($archs)" ;;
              *) echo "not universal: $fat ($archs)"; exit 1 ;;
            esac
          done
          install -m755 "$out/bin/rustmagic" "$app/MacOS/RustMagic"
          install -m644 packaging/macos/Info.plist "$app/Info.plist"
          printf 'APPL????' > "$app/PkgInfo"
          install -m644 crates/km-ffi/include/rustmagic.h "$out/lib/"
          mkdir -p "$app/Resources/keyboards"
          install -m644 keyboards/bundled/*.km2 "$app/Resources/keyboards/"
          install -m644 README.md LICENSE "$out/"
          # The .icns comes from the one brand PNG, through Apple's own tools.
          iconset="$(mktemp -d)/RustMagic.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z $size $size dist/brand/rustmagic-1024.png \
              --out "$iconset/icon_${size}x${size}.png" >/dev/null
            sips -z $((size * 2)) $((size * 2)) dist/brand/rustmagic-1024.png \
              --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Resources/RustMagic.icns"
          cat <<'TXT' | sed 's/^          //' > "$out/INSTALL.txt"
          RustMagic on macOS

            RustMagic.dmg        drag RustMagic.app to Applications
            bin/rustmagic-cli    the command line front end
            lib/libkm_ffi.dylib  the C ABI, for another input-method framework

          The app is unsigned, so the first launch needs right-click, Open.
          There is no macOS input method in this release yet: the engine, the
          window, the CLI and the C ABI work, and system-wide typing is the next
          piece of work.
          TXT
      - name: make the disk image and the archive
        run: |
          version="${{ steps.version.outputs.version }}"
          out="dist/rustmagic-$version-macos-universal"
          tools/package/dmg.sh "$version" "$out/RustMagic.app" "dist/RustMagic-$version-universal.dmg"
          zip -qry "$out.zip" "$out"
          shasum -a 256 "$out.zip" > "$out.zip.sha256"
          ls -l dist/*.dmg dist/*.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          files: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*.zip
            dist/*.zip.sha256

  windows:
    name: windows (.exe, .msi, .zip)
    runs-on: windows-latest
    needs: brand
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: brand
          path: dist/brand
      - name: resolve the version
        id: version
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: build
        run: |
          cargo build --release --locked --package rustmagic --package rustmagic-cli --package km-ffi
      - name: test before shipping
        run: cargo test --release --locked -p km-core -p km-binary -p km-script -p km-engine -p km-store -p km-session -p ui-egui
      - name: assemble
        shell: bash
        run: |
          out="dist/windows"
          mkdir -p "$out/keyboards"
          cp target/release/rustmagic.exe target/release/rustmagic-cli.exe "$out/"
          cp target/release/km_ffi.dll "$out/"
          cp crates/km-ffi/include/rustmagic.h "$out/"
          cp keyboards/bundled/*.km2 "$out/keyboards/"
          cp README.md LICENSE "$out/"
          cp dist/brand/rustmagic.ico "$out/"
          cat <<'TXT' | sed 's/^          //' > "$out/INSTALL.txt"
          RustMagic on Windows

            rustmagic.exe       the manager window
            rustmagic-cli.exe   the command line front end, no window needed
            km_ffi.dll          the engine's C ABI, for an input-method service
            rustmagic.h         its header
            keyboards\          the five Myanmar layouts that ship with it

          There is no TSF text service in this release yet, so typing into other
          applications with a layout is the next piece of work. Managing
          keyboards, trying them, and driving the engine from code all work.
          TXT
      - name: installer (.exe)
        shell: bash
        run: |
          set -e
          iscc=$(ls "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
                    "/c/Program Files/Inno Setup 6/ISCC.exe" 2>/dev/null | head -1)
          if [ -z "$iscc" ]; then
            echo "::error::Inno Setup is not on this runner"
            exit 1
          fi
          "$iscc" "/DMyAppVersion=${{ steps.version.outputs.version }}" packaging/windows/rustmagic.iss
          ls -l dist/*.exe
      - name: installer (.msi)
        shell: pwsh
        run: |
          $wix = @(
            "C:\Program Files (x86)\WiX Toolset v3.14\bin",
            "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          ) | Where-Object { Test-Path "$_\candle.exe" } | Select-Object -First 1
          if (-not $wix) {
            throw "WiX Toolset is not on this runner"
          }
          & "$wix\candle.exe" -nologo -dVersion="${{ steps.version.outputs.version }}" `
            -out dist\rustmagic.wixobj packaging\windows\rustmagic.wxs
          & "$wix\light.exe" -nologo -ext WixUIExtension `
            -out "dist\RustMagic-${{ steps.version.outputs.version }}-x64.msi" dist\rustmagic.wixobj
      - name: portable archive
        shell: bash
        run: |
          cd dist
          mv windows "rustmagic-${{ steps.version.outputs.version }}-windows-x86_64"
          zip -qr "rustmagic-${{ steps.version.outputs.version }}-windows-x86_64.zip" \
            "rustmagic-${{ steps.version.outputs.version }}-windows-x86_64"
          sha256sum *.zip > "rustmagic-${{ steps.version.outputs.version }}-windows-x86_64.zip.sha256"
          ls -l *.zip *.exe *.msi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          files: |
            dist/*Setup*.exe
            dist/*.msi
            dist/*windows-x86_64.zip
            dist/*windows-x86_64.zip.sha256

  arch:
    name: arch (.pkg.tar.zst)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: toolchain and runtime dependencies
        # `makepkg` refuses to run as root, and it should not need sudo for
        # anything, so everything the package depends on is installed first.
        run: pacman -Syu --noconfirm --needed base-devel git curl rust ibus python dbus
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: resolve the version
        id: version
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: build the package from the tag
        run: |
          version="${{ steps.version.outputs.version }}"
          # makepkg refuses to run as root, so it runs as a builder user that
          # owns a copy of the packaging files and the source archive.
          useradd -m builder
          install -d -o builder -g builder /home/builder/build
          cp packaging/arch/PKGBUILD packaging/arch/rustmagic.install /home/builder/build/
          chown -R builder:builder /home/builder/build
          cd /home/builder/build
          sed -i "s/^pkgver=.*/pkgver=$version/" PKGBUILD
          # The source archive of the tag is downloaded here and shipped beside
          # the package. Because `source=()` names that exact file, `makepkg -si`
          # in the download directory verifies a checksum instead of hoping that
          # GitHub's archive of a tag never changes.
          curl -fsSL -o "rustmagic-$version.tar.gz" \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v$version.tar.gz"
          checksum=$(sha256sum "rustmagic-$version.tar.gz" | cut -d' ' -f1)
          sed -i "s|^source=.*|source=(\"rustmagic-\$pkgver.tar.gz\")|" PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('$checksum')/" PKGBUILD
          su builder -s /bin/bash -c "cd /home/builder/build && makepkg --noconfirm --nocheck"
          su builder -s /bin/bash -c "cd /home/builder/build && makepkg --printsrcinfo > .SRCINFO"
          # The download is the package, the two files that rebuild it, and the
          # source they name -- all with the names makepkg expects.
          mkdir -p /tmp/assets
          cp /home/builder/build/rustmagic-"$version"-*.pkg.tar.zst /tmp/assets/
          cp /home/builder/build/PKGBUILD /tmp/assets/PKGBUILD
          cp /home/builder/build/rustmagic.install /tmp/assets/rustmagic.install
          cp /home/builder/build/.SRCINFO "/tmp/assets/rustmagic-$version.SRCINFO"
          cp "/home/builder/build/rustmagic-$version.tar.gz" /tmp/assets/
          ls -l /tmp/assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          files: /tmp/assets/*

  publish:
    name: publish the release
    needs: [linux, rpm, macos, windows, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # On a tag push this is the tag; on a manual run it is the tag that
          # was asked for. Either way the source is what the version names.
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: check every target landed, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # A draft release whose assets are missing a platform is worse than no
          # release, so the count is checked before anything becomes public.
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                     --json assets --jq '.assets[].name')
          echo "$assets"
          for expected in \
              linux-x86_64.tar.gz \
              _amd64.deb \
              .rpm \
              .dmg \
              Setup-x64.exe \
              x64.msi \
              pkg.tar.zst \
              PKGBUILD
          do
            if ! echo "$assets" | grep -q "$expected"; then
              echo "::error::the release has no $expected artifact"
              exit 1
            fi
          done
          notes=$(mktemp)
          cat <<'TXT' | sed 's/^          //' > "$notes"
          One engine, and an installer for every platform, built from the tag.

          | Platform | Download | Install with |
          | --- | --- | --- |
          | Windows | `RustMagic-<v>-Setup-x64.exe` | run it |
          | Windows (managed) | `RustMagic-<v>-x64.msi` | `msiexec /i`, Group Policy, Intune |
          | macOS (universal) | `RustMagic-<v>-universal.dmg` | open, drag to Applications |
          | Debian, Ubuntu | `rustmagic_<v>_amd64.deb` | `sudo apt install ./rustmagic_<v>_amd64.deb` |
          | Fedora, RHEL | `rustmagic-<v>-1.x86_64.rpm` | `sudo dnf install ./rustmagic-<v>-1.x86_64.rpm` |
          | Arch | `rustmagic-<v>-1-x86_64.pkg.tar.zst` | `sudo pacman -U` |
          | Arch (from source) | `PKGBUILD` + `rustmagic.install` + `rustmagic-<v>.tar.gz` | `makepkg -si` |
          | anywhere | `.tar.gz` / `.zip` | unpack and run |

          Every release carries five Myanmar keyboards — Pyidaungsu MM, my-Win
          2.3.0, MyanSan, Zawgyi and ZawCode — embedded in the binaries, so a
          fresh install types without downloading anything.

          Checksums are next to every archive. The macOS app and the Windows
          installers are unsigned: macOS needs right-click, Open, the first time.

          **Not in this release.** There is no Windows TSF service and no macOS
          input method yet, so system-wide typing is IBus on Linux only. Nothing
          is signed or notarised, and no crate is published.

          Details, including how to cut the next one: `docs/RELEASING.md`.
          TXT
          sed -i "s/<v>/${TAG#v}/g" "$notes"
          # The package names carry the pkgrel, so they are read from the upload.
          deb=$(echo "$assets" | grep '_amd64\.deb' | head -1)
          rpm=$(echo "$assets" | grep '\.rpm' | head -1)
          arch=$(echo "$assets" | grep 'pkg\.tar\.zst' | head -1)
          sed -i "s/rustmagic_<v>_amd64\.deb/$deb/g; s/rustmagic-<v>-1\.x86_64\.rpm/$rpm/g; s/rustmagic-<v>-1-x86_64\.pkg\.tar\.zst/$arch/g" "$notes"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false \
            --title "RustMagic ${TAG#v}" --notes-file "$notes"
